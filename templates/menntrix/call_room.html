{% extends "base/app_shell.html" %}
{% load static %}

{% block title %}Call — MENNTRIX{% endblock %}

{% block main_left %}{% endblock %}
{% block main_right %}{% endblock %}

{% block extra_head %}
<style>
    .mnx-main { grid-template-columns: 1fr !important; padding: 14px; }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CALL_ID = "{{ session.call_id }}";
const USER_ID = {{ user.id }};
const PEER_ID = {{ peer.id }};
const ICE_SERVERS = {{ ice_servers_json|safe }};
const MEDIA_URL = "{{ media_url|escapejs }}";
const AVATARS = {{ avatars_json|safe }};
const CALL_TYPE = "{{ session.call_type }}";
const PEER_NAME = "{{ peer.firstname|default:peer.username|escapejs }}";
const PEER_USERNAME = "{{ peer.username|escapejs }}";
const PEER_SHARE_URL = "{{ peer_share_url|escapejs }}";

let ws = null;
let pc = null;
let localStream = null;
let sharingLocation = false;
let map = null;
let peerMarker = null;
let pingTimer = null;
let ended = false;

function getCookie(name) {
    const m = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[2]) : '';
}

function startPing() {
    const send = () => {
        fetch(`/call/${CALL_ID}/ping/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': getCookie('csrftoken') },
        }).catch(() => {});
    };
    send();
    pingTimer = setInterval(send, 30000);
}
function stopPing() {
    if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
}

window.addEventListener('pagehide', () => {
    if (ended) return;
    const csrf = getCookie('csrftoken') || '';
    fetch(`/call/${CALL_ID}/end-ajax/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': csrf },
        keepalive: true,
    }).catch(() => {});
});

function buildCallUI() {
    const mainEl = document.querySelector('.mnx-main');
    if (!mainEl) return;

    const peerAvatar = AVATARS[PEER_ID]
        ? `${MEDIA_URL}profile_pictures/${AVATARS[PEER_ID]}`
        : '';

    mainEl.innerHTML = `
        <div class="mnx-meeting">
            <div class="mnx-meeting-stage" id="videoGrid">
                <div class="mnx-meeting-tile mnx-meeting-tile-local" id="localTile">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <span class="mnx-meeting-tile-label">You</span>
                </div>
                <div class="mnx-meeting-tile" id="remoteTile">
                    ${peerAvatar ? `<img class="mnx-meeting-tile-avatar" src="${peerAvatar}" alt="${PEER_NAME}">` : ''}
                    <video id="remoteVideo" autoplay playsinline></video>
                    <span class="mnx-meeting-tile-label">${PEER_NAME}</span>
                    <div class="mnx-call-overlay" id="remoteOverlay">Calling ${PEER_NAME}…</div>
                </div>
            </div>

            <div class="mnx-meeting-head">
                <div>
                    <h2 class="mnx-meeting-title">${PEER_NAME}</h2>
                    <span class="mnx-meeting-meta">@${PEER_USERNAME} · <span id="callStatus">Connecting…</span></span>
                </div>
                <div>
                    <a href="${PEER_SHARE_URL}" class="mnx-btn" target="_blank">↗ SHARE PROFILE</a>
                </div>
            </div>

            <div class="mnx-meeting-side">
                <div class="mnx-meeting-chat">
                    <div class="mnx-call-chat-messages" id="chatMessages"></div>
                    <input type="text" id="chatInput" placeholder="Type a message…" class="mnx-call-chat-input">
                </div>

                <div class="mnx-meeting-controls mnx-call-controls">
                    <button class="mnx-call-btn" id="btnMic" title="Mute mic">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                    </button>
                    <button class="mnx-call-btn" id="btnCam" title="Camera on/off">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="23 7 16 12 23 17 23 7"/>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                        </svg>
                    </button>
                    <button class="mnx-call-btn" id="btnSwitch" title="Switch voice / video">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="17 1 21 5 17 9"/>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                            <polyline points="7 23 3 19 7 15"/>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                        </svg>
                    </button>
                    <button class="mnx-call-btn" id="btnShareLoc" title="Share location">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                    </button>
                    <button class="mnx-call-btn mnx-call-btn-end" id="btnEnd" title="End call">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="9" y1="9" x2="15" y2="15"/>
                            <line x1="15" y1="9" x2="9" y2="15"/>
                        </svg>
                    </button>
                </div>

                <div id="callMapWrap" class="mnx-call-map-wrap" style="display:none;">
                    <div id="callMap" class="mnx-call-map"></div>
                    <p class="mnx-call-map-note">📍 Live location sharing is ON</p>
                </div>
            </div>
        </div>
    `;
}

async function init() {
    buildCallUI();
    startPing();

    const localVideo = document.getElementById('localVideo');
    const callStatus = document.getElementById('callStatus');

    const constraints = CALL_TYPE === "video"
        ? { video: true, audio: true }
        : { video: false, audio: true };

    try {
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        localVideo.srcObject = localStream;
        if (CALL_TYPE !== "video") {
            document.getElementById('localTile').style.display = 'none';
        }
    } catch (e) {
        callStatus.textContent = "Camera/mic access denied";
        return;
    }

    const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${wsScheme}://${window.location.host}/ws/call/${CALL_ID}/`);
    ws.onopen = () => { callStatus.textContent = "Ringing…"; };
    ws.onmessage = handleSignalMessage;
    
    ws.onclose = () => { 
        if (!ended) {
            ended = true;
            window.location.href = "{% url 'dashboard' %}";
        }
    };

    document.getElementById('btnEnd').onclick = endCall;
    document.getElementById('btnMic').onclick = toggleMic;
    document.getElementById('btnCam').onclick = toggleCam;
    document.getElementById('btnSwitch').onclick = switchMode;
    document.getElementById('btnShareLoc').onclick = toggleLocationShare;

    document.getElementById('chatInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            const text = e.target.value.trim();
            if (text && ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'chat', text }));
                e.target.value = '';
            }
        }
    });
}

function handleSignalMessage(event) {
    const data = JSON.parse(event.data);
    const callStatus = document.getElementById('callStatus');
    switch (data.type) {
        case "peer_join":
            callStatus.textContent = "Peer joined";
            createPeerConnection();
            if (data.user_id !== USER_ID) sendOffer();
            break;
        case "signal": handleSignal(data); break;
        case "chat": appendChat(data.username, data.text); break;
        case "location": showPeerLocation(data.lat, data.lng); break;
        case "peer_leave":
        case "call_ended":
            cleanup();
            break;
    }
}

async function createPeerConnection() {
    if (pc) return;
    const remoteVideo = document.getElementById('remoteVideo');
    const remoteOverlay = document.getElementById('remoteOverlay');
    const remoteTile = document.getElementById('remoteTile');
    const callStatus = document.getElementById('callStatus');

    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    pc.onicecandidate = e => {
        if (e.candidate) ws.send(JSON.stringify({ type: 'ice', payload: e.candidate }));
    };
    pc.ontrack = e => {
        remoteVideo.srcObject = e.streams[0];
        if (remoteOverlay) remoteOverlay.style.display = "none";
        const avatar = remoteTile.querySelector('.mnx-meeting-tile-avatar');
        if (avatar) avatar.style.display = 'none';
        callStatus.textContent = "Connected";
    };
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
}

async function sendOffer() {
    if (!pc) return;
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({ type: 'offer', payload: offer }));
}

async function handleSignal(data) {
    if (!pc) createPeerConnection();
    if (data.signal_type === "offer") {
        await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', payload: answer }));
    } else if (data.signal_type === "answer") {
        await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
    } else if (data.signal_type === "ice") {
        try { await pc.addIceCandidate(new RTCIceCandidate(data.payload)); } catch (e) {}
    }
}

function toggleMic() {
    const a = localStream.getAudioTracks();
    a.forEach(t => t.enabled = !t.enabled);
    document.getElementById('btnMic').classList.toggle('mnx-call-btn-off', !a[0]?.enabled);
}
function toggleCam() {
    const v = localStream.getVideoTracks();
    v.forEach(t => t.enabled = !t.enabled);
    document.getElementById('btnCam').classList.toggle('mnx-call-btn-off', !v[0]?.enabled);
}
async function switchMode() {
    if (!localStream || !pc) return;
    let videoTrack = localStream.getVideoTracks()[0];
    if (videoTrack) {
        videoTrack.stop();
        localStream.removeTrack(videoTrack);
        pc.getSenders().forEach(s => { if (s.track && s.track.kind === "video") pc.removeTrack(s); });
        document.getElementById('localTile').style.display = 'none';
    } else {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const t = stream.getVideoTracks()[0];
        localStream.addTrack(t);
        pc.addTrack(t, localStream);
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('localTile').style.display = '';
    }
}
function toggleLocationShare() {
    sharingLocation = !sharingLocation;
    document.getElementById('btnShareLoc').classList.toggle('mnx-call-btn-off', !sharingLocation);
    if (sharingLocation) {
        document.getElementById('callMapWrap').style.display = "block";
        initMap();
        navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'location', lat: latitude, lng: longitude, accuracy: Math.round(accuracy || 0) }));
            }
        }, err => console.warn(err), { enableHighAccuracy: true });
    } else {
        document.getElementById('callMapWrap').style.display = "none";
    }
}
function initMap() {
    if (map) return;
    const el = document.getElementById('callMap');
    if (!el) return;
    map = L.map(el, { center: [0, 0], zoom: 2 });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19, subdomains: 'abcd',
        attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);
}
function showPeerLocation(lat, lng) {
    if (!map) initMap();
    const pos = [parseFloat(lat), parseFloat(lng)];
    if (!peerMarker) {
        peerMarker = L.circleMarker(pos, { radius: 7, color: '#ccff00', weight: 2, fillColor: '#ccff00', fillOpacity: 0.35 }).addTo(map);
        map.setView(pos, 13);
    } else {
        peerMarker.setLatLng(pos);
    }
}
function appendChat(username, text) {
    const box = document.getElementById('chatMessages');
    if (!box) return;
    const el = document.createElement('div');
    el.className = 'mnx-call-chat-msg';
    const strong = document.createElement('strong');
    strong.textContent = username + ':';
    el.appendChild(strong);
    el.appendChild(document.createTextNode(' ' + text));
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
}

function endCall() {
    if (ended) return;
    ended = true;
    
    // 1. Hit the HTTP endpoint (this now broadcasts to BOTH global listeners)
    fetch(`/call/${CALL_ID}/end-ajax/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': getCookie('csrftoken') },
        keepalive: true,
    }).catch(() => {});
    
    // 2. Clean up UI and redirect instantly
    cleanup();
}

function cleanup() {
    if (!ws && !pc && !localStream) return; 
    
    stopPing();
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    if (ws) { try { ws.close(); } catch (e) {} ws = null; }
    
    // Redirect instantly
    window.location.href = "{% url 'dashboard' %}";
}

document.addEventListener('DOMContentLoaded', init);
</script>
{% endblock %}
